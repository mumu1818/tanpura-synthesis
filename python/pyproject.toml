[project]
name = "panini"
version = "0.1.0"
description = "A small, exact, traceable model of Pāṇini's Aṣṭādhyāyī: derivations, Lean-mirrored rules, compiled neural networks and deterministic speech"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
neural = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["panini*"]
